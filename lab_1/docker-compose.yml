version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: onlinestore
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://user:password@db:5432/onlinestore

volumes:
  postgres_data: